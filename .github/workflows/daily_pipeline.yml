name: Daily Risk Pipeline

# Runs every weekday at 9:30pm UTC (after US market close ~4pm ET / 9pm UTC,
# with a buffer for yfinance data to settle). Also runnable manually.
on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch: {}

jobs:
  # Same test suite as on every push; if a metric is broken, nothing is published
  tests:
    uses: ./.github/workflows/ci.yml

  update-pipeline:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed so the workflow can commit updated charts back to the repo

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ON_ERROR_STOP makes a SQL error fail the job instead of being printed and skipped
      - name: Create / migrate schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f sql/schema.sql

      - name: Refresh prices (full lookback window)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python ingest_watchlist_yfinance.py

      - name: Recompute risk metrics, VaR forecasts and backtest (SQL)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f sql/metrics.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/risk_metrics_query.sql

      - name: Generate daily snapshot + regenerate visuals
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/daily_snapshot.py
          python analysis/generate_visuals.py

      - name: Commit updated charts and snapshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated daily update: prices, metrics, and charts"
          file_pattern: 'visuals/*.png SNAPSHOT.md data_summary.csv anomaly_history.csv var_backtest.csv'
